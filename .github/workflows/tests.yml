name: Pruebas automáticas EFT

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y archivos LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Completar descarga de Git LFS
        shell: bash
        run: |
          git lfs install
          git lfs pull
          git lfs checkout

      - name: Verificar dataset final
        shell: bash
        run: |
          DATASET="data/processed/hourlySteps_eft_final.csv"

          echo "Commit utilizado:"
          git log -1 --oneline

          echo "Contenido de data/processed:"
          ls -lah data/processed || true

          if [ ! -f "$DATASET" ]; then
            echo "::error::No existe $DATASET en el checkout de la rama actual."
            exit 1
          fi

          if [ ! -s "$DATASET" ]; then
            echo "::error::El archivo $DATASET está vacío."
            exit 1
          fi

          PRIMERA_LINEA="$(head -n 1 "$DATASET")"
          echo "Primera línea del dataset:"
          echo "$PRIMERA_LINEA"

          if echo "$PRIMERA_LINEA" | grep -qi "404: Not Found"; then
            echo "::error::El archivo contiene una respuesta 404 y no un CSV válido."
            exit 1
          fi

          if echo "$PRIMERA_LINEA" | grep -q "version https://git-lfs.github.com/spec/v1"; then
            echo "::error::El archivo sigue siendo un puntero de Git LFS."
            exit 1
          fi

          if ! echo "$PRIMERA_LINEA" | grep -q "Id"; then
            echo "::error::El encabezado no contiene la columna Id."
            exit 1
          fi

          if ! echo "$PRIMERA_LINEA" | grep -q "ActivityHour"; then
            echo "::error::El encabezado no contiene la columna ActivityHour."
            exit 1
          fi

          if ! echo "$PRIMERA_LINEA" | grep -q "StepTotal"; then
            echo "::error::El encabezado no contiene la columna StepTotal."
            exit 1
          fi

          echo "Dataset verificado correctamente."
          du -h "$DATASET"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        shell: bash
        run: pytest tests/ -v
