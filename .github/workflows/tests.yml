name: Pruebas automáticas EFT

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mostrar commit utilizado
        run: |
          git rev-parse HEAD
          git log -1 --oneline

      - name: Verificar archivos descargados
        run: |
          pwd
          echo "Contenido de data:"
          find data -maxdepth 3 -type f -print | sort
          echo "Contenido de data/processed:"
          ls -lah data/processed || true

      - name: Verificar dataset final
        run: |
          test -f data/processed/hourlySteps_eft_final.csv
          echo "Dataset encontrado correctamente"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest tests/ -v
