version: "3.9"

services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dashboard_actividad_fisica
    ports:
      - "8501:8501"
    env_file:
      - ../.env.example
    volumes:
      - ../data:/app/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: api_actividad_fisica
    command: uvicorn api.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ../.env.example
    volumes:
      - ../data:/app/data
